<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body { color: #f4f6f2; background: #101412; font-family: "Noto Sans", sans-serif; }
    body::before, body::after {
      content: "";
      position: absolute;
      left: 56px;
      right: 56px;
      height: 1px;
      background: #aeb9b52b;
    }
    body::before { top: 54px; }
    body::after { bottom: 54px; }
    .copy { position: absolute; left: 72px; top: 82px; z-index: 2; }
    .signal { margin: 0 0 42px; color: #aeb9b5; font: 14px "DejaVu Sans Mono", monospace; }
    .signal i { width: 8px; height: 8px; margin-right: 12px; display: inline-block; border-radius: 50%; background: #ff6b5f; }
    h1 { margin: 0; font-size: 126px; line-height: .84; letter-spacing: 0; text-transform: uppercase; }
    .tagline { margin: 28px 0 0; color: #58d6bd; font-size: 34px; font-weight: 700; }
    .meta { margin: 74px 0 0; color: #aeb9b5; font: 14px "DejaVu Sans Mono", monospace; }
    .domain { position: absolute; right: 70px; bottom: 73px; margin: 0; color: #f4f6f2; font: 15px "DejaVu Sans Mono", monospace; }
    .mark { position: absolute; right: 85px; top: 50px; width: 440px; height: 440px; }
    .mark i { position: absolute; inset: 0; border: 1px solid #58d6bd30; border-radius: 50%; }
    .mark i:nth-child(2) { inset: 54px; border-color: #aeb9b528; }
    .mark i:nth-child(3) { inset: 112px; border-color: #58d6bd45; }
    .mark::before, .mark::after { content: ""; position: absolute; background: #58d6bd; }
    .mark::before { left: -36px; top: 220px; width: 512px; height: 1px; }
    .mark::after { left: 220px; top: -36px; width: 1px; height: 512px; }
    .mark img { position: absolute; left: 147px; top: 147px; width: 146px; height: 146px; z-index: 2; box-shadow: 0 22px 55px #0008; }
    .node { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #58d6bd; z-index: 3; }
    .node-a { right: 15px; top: 132px; }
    .node-b { left: 24px; bottom: 91px; background: #ff6b5f; }
    .node-c { right: 78px; bottom: 42px; background: #aeb9b5; }
  </style>
</head>
<body>
  <div class="copy">
    <p class="signal"><i></i>ENTROPY MAINNET / RELEASE 1.5.5</p>
    <h1>Entcoin</h1>
    <p class="tagline">Your node. Your wallet. Your agent.</p>
    <p class="meta">PROOF OF WORK / LOCAL VALIDATION / AGENT PAYMENTS</p>
  </div>
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i><img src="../assets/appicon.png" alt=""><span class="node node-a"></span><span class="node node-b"></span><span class="node node-c"></span></div>
  <p class="domain">entcoin.xyz ↗</p>
</body>
</html>
